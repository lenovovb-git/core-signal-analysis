[project]
name = "core-signal-agent"
version = "0.1.0"
description = "核心网信令分析Agent - 本地运行的信令排障工具"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.28.0",
    "pyyaml>=6.0",
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "ui*"]
exclude = ["tests*", "samples*", "knowledge*", "data*"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]