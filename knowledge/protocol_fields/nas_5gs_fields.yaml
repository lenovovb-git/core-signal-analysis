# NAS-5GS协议关键字段说明

## 通用字段
- frame.number: 帧号
- frame.time: 时间戳
- nas_5gs.message_type: NAS-5GS消息类型
- nas_5gs.security_header_type: 安全头类型
- nas_5gs.protocol_discriminator: 协议鉴别器

## 消息类型 (message_type)
### 注册管理消息 (0x41)
- 0x41: Registration request (注册请求)
- 0x42: Registration accept (注册接受)
- 0x43: Registration complete (注册完成)
- 0x44: Registration reject (注册拒绝)
- 0x45: Deregistration request (去注册请求)
- 0x46: Deregistration accept (去注册接受)

### 会话管理消息 (0x2e)
- 0x2d: PDU session establishment request (PDU会话建立请求)
- 0x2e: PDU session establishment accept (PDU会话建立接受)
- 0x2f: PDU session establishment reject (PDU会话建立拒绝)
- 0x30: PDU session authentication command (PDU会话鉴权命令)
- 0x31: PDU session authentication complete (PDU会话鉴权完成)
- 0x32: PDU session authentication result (PDU会话鉴权结果)

### 服务请求消息
- 0x4c: Service request (服务请求)
- 0x4d: Service accept (服务接受)
- 0x4e: Service reject (服务拒绝)

### 鉴权消息
- 0x56: Authentication request (鉴权请求)
- 0x57: Authentication response (鉴权响应)
- 0x58: Authentication reject (鉴权拒绝)
- 0x59: Authentication failure (鉴权失败)

## 关键信息元素 (IE)
### 注册相关IE
- nas_5gs.nmm.registration_type: 注册类型 (初始/移动/周期)
- nas_5gs.nmm.5gs_mobile_identity: 5G移动标识 (SUCI/SUPI/5G-GUTI)
- nas_5gs.nmm.5gs_tracking_area_identity: 5G跟踪区标识
- nas_5gs.nmm.last_visited_registered_tai: 最后访问注册TAI
- nas_5gs.nmm.ue_network_capability: UE网络能力

### 会话相关IE
- nas_5gs.sm.pdu_session_id: PDU会话ID (0-15)
- nas_5gs.sm.s_nssai: 单网络切片选择辅助信息
- nas_5gs.sm.dnn: 数据网络名称
- nas_5gs.sm.pdu_session_type: PDU会话类型 (IPv4/IPv6/IPv4v6/Ethernet/Unstructured)
- nas_5gs.sm.5gsm_capability: 5GSM能力

### 鉴权相关IE
- nas_5gs.nmm.auth_param_rand: 鉴权参数RAND
- nas_5gs.nmm.auth_param_autn: 鉴权参数AUTN
- nas_5gs.nmm.auth_response_param_res: 鉴权响应参数RES
- nas_5gs.nmm.auth_response_param_res_star: 鉴权响应参数RES*
- nas_5gs.nmm.auth_failure_param_auts: 鉴权失败参数AUTS

