## 解析提示
1. 先看message_type确定消息类型
2. 如果是reject消息，重点关注cause字段
3. 通过5gs_mobile_identity关联UE
4. 通过pdu_session_id关联会话
5. s_nssai和dnn用于判断切片和数据网络
6. 鉴权相关消息关注RAND/AUTN/RES/AUTS等参数